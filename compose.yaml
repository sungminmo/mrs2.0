name: mrs

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080:80"
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_MAX: ${DB_POOL_MAX:-5}
      DB_TIMEOUT_MS: ${DB_TIMEOUT_MS:-5000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      TZ: UTC
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const response = await fetch('http://127.0.0.1:3000/api/health/ready', { signal: AbortSignal.timeout(5500) }); process.exit(response.ok ? 0 : 1)"]
      interval: 10s
      timeout: 6s
      retries: 3
      start_period: 20s
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    networks:
      - app
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/mrs2.0/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging: *logging

networks:
  app: