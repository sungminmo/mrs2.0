name: Deploy customer portal

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - docker/nginx.conf
      - index.html
      - package.json
      - package-lock.json
      - public/**
      - scripts/deploy-service.sh
      - src/**
      - tsconfig*.json
      - vite.customer.config.ts
      - .github/workflows/deploy-customer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-customer
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/sungminmo/mrs-customer:${{ github.sha }}
          cache-from: type=gha,scope=customer
          cache-to: type=gha,mode=max,scope=customer
      - name: Deploy on Lightsail
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'cd /home/ubuntu/MRS && flock /tmp/mrs-source.lock git pull --ff-only origin main && ./scripts/deploy-service.sh customer '"$GITHUB_SHA"