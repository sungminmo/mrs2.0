name: Deploy admin portal

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.admin
      - admin.html
      - compose.yaml
      - docker/admin.nginx.conf
      - package.json
      - package-lock.json
      - public/**
      - scripts/deploy-service.sh
      - src/**
      - tsconfig*.json
      - vite.admin.config.ts
      - .github/workflows/deploy-admin.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-admin
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.admin
          push: true
          tags: ghcr.io/sungminmo/mrs-admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,mode=max,scope=admin
      - name: Deploy on Lightsail
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%b\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          printf '%b\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" 'cd /home/ubuntu/MRS && flock /tmp/mrs-source.lock git pull --ff-only origin main && ./scripts/deploy-service.sh admin '"$GITHUB_SHA"